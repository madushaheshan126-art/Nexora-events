<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Events | Admin Studio</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* === NEXORA LUXURY ADMIN UI === */
    :root {
      --bg-main: #000000;
      --bg-panel: #111111;
      --bg-input: #1a1a1a;
      --gold: #d4af37;
      --gold-hover: #f1c40f;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border: #333333;
    }

    /* 1. Global Backgrounds */
    body, html, #nc-root {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
    }

    /* 2. Force ALL Decap Container Backgrounds to Dark */
    div[class*="AppMainContainer"], 
    div[class*="CollectionContainer"], 
    div[class*="EditorContainer"], 
    div[class*="ToolbarContainer"],
    div[class*="ControlPaneContainer"],
    aside[class*="SidebarContainer"],
    div[class*="Card"],
    div[class*="PreviewPane"] {
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      border-color: var(--border) !important;
    }

    /* 3. Header & Sidebar */
    header[class*="AppHeader"] {
      background-color: var(--bg-panel) !important;
      border-bottom: 1px solid var(--gold) !important;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1) !important;
    }
    header h1, header a, header span { color: var(--gold) !important; }
    
    aside[class*="SidebarContainer"] {
      border-right: 1px solid var(--border) !important;
      background-color: var(--bg-panel) !important;
    }
    a[class*="SidebarNavLink"] { color: var(--text-muted) !important; }
    a[class*="SidebarNavLink"][class*="active"] {
      color: var(--gold) !important;
      border-left: 3px solid var(--gold) !important;
      background: rgba(212, 175, 55, 0.1) !important;
    }

    /* 4. Form Fields & Labels */
    label[class*="FieldLabel"] {
      color: var(--gold) !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 2px !important;
      font-size: 12px !important;
      border: none !important;
      background: transparent !important;
      margin-bottom: 8px !important;
    }

    input, textarea, select, 
    div[class*="ControlContainer"], 
    div[class*="DateTimeControl"] input {
      background-color: var(--bg-input) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px !important;
      padding: 10px !important;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--gold) !important;
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.4) !important;
      outline: none !important;
    }

    /* 5. List Items & Cards (Dashboard) */
    a[class*="ListCard"] {
      background-color: var(--bg-panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      margin-bottom: 12px !important;
      transition: all 0.3s ease !important;
    }
    a[class*="ListCard"]:hover { 
      border-color: var(--gold) !important; 
      transform: translateY(-2px) !important;
    }
    h2[class*="CardHeading"] { color: var(--text-main) !important; }

    /* 6. Buttons */
    button[class*="Button"], a[class*="Button"] {
      border-radius: 4px !important;
      transition: all 0.3s ease !important;
    }
    
    /* Primary Action Buttons (Publish, New) */
    button[class*="PublishButton"], 
    a[class*="CollectionTopNewButton"],
    button[class*="LoginButton"] {
      background-color: var(--gold) !important;
      color: #000 !important;
      font-weight: bold !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
    }
    button[class*="PublishButton"]:hover, 
    a[class*="CollectionTopNewButton"]:hover {
      background-color: var(--gold-hover) !important;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4) !important;
    }

    /* Secondary Buttons (Upload Image, etc) */
    button[class*="FileWidgetButton"] {
      background-color: var(--bg-main) !important;
      border: 1px solid var(--gold) !important;
      color: var(--gold) !important;
    }
    button[class*="FileWidgetButton"]:hover {
      background-color: var(--gold) !important;
      color: #000 !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
