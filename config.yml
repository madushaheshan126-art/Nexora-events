backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Completed Events"
    folder: "_events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Event Title", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Location / Venue", name: "location", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "Luxury Wedding" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Event Summary", name: "description", widget: "text" }